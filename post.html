<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel — ZeitGeist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F4F7;--white:#FFFFFF;--card:#FFFFFF;--ink:#1C1524;--mid:#2D1F3A;--border:#E0DBE8;--accent:#7C3AED;--violet:#A78BFA;--muted:#6B6478;--light:#AEA8BA;--warm:#F0EEF5}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:var(--mid);border-bottom:2px solid var(--accent)}
.hdr-inner{max-width:1280px;margin:0 auto;padding:16px 44px;display:flex;align-items:center;justify-content:space-between}
.logo{text-decoration:none}
.logo-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:#fff;letter-spacing:-0.5px}
.logo-name .g{color:var(--violet)}
nav{background:var(--ink)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 44px;display:flex}
nav a{display:block;padding:11px 16px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:color 0.2s}
nav a:hover{color:#fff}
.post-hero{background:var(--mid);position:relative;overflow:hidden}
.post-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,58,237,0.12),transparent)}
.ph-inner{max-width:1280px;margin:0 auto;padding:64px 44px;display:grid;grid-template-columns:1fr 380px;gap:60px;position:relative}
.ph-breadcrumb{font-size:11px;color:rgba(255,255,255,0.2);margin-bottom:18px;display:flex;gap:6px;font-weight:500}
.ph-breadcrumb a{color:rgba(255,255,255,0.2);text-decoration:none;transition:color 0.2s}
.ph-breadcrumb a:hover{color:var(--violet)}
.ph-tag{display:inline-block;background:var(--accent);color:#fff;font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:4px 12px;border-radius:4px;margin-bottom:16px}
.ph-title{font-family:'Playfair Display',serif;font-size:52px;font-weight:900;color:#fff;line-height:1.02;margin-bottom:20px;letter-spacing:-1px}
.ph-meta{display:flex;align-items:center;gap:14px;font-size:12px;color:rgba(255,255,255,0.3);padding-top:18px;border-top:1px solid rgba(255,255,255,0.07);flex-wrap:wrap}
.ph-meta strong{color:rgba(255,255,255,0.75);font-weight:600}
.ph-av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.ph-visual{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ph-vis-letter{font-family:'Playfair Display',serif;font-size:160px;font-weight:900;color:rgba(255,255,255,0.05);line-height:1;font-style:italic}
.ph-vis-gem{position:absolute;width:60px;height:60px;border:2px solid rgba(124,58,237,0.2);transform:rotate(45deg)}
.layout{max-width:1200px;margin:48px auto;padding:0 44px;display:grid;grid-template-columns:1fr 270px;gap:36px}
.main-col{background:var(--card);padding:52px 56px;border:1px solid var(--border);border-radius:10px;border-top:3px solid var(--accent)}
.back-btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border);color:var(--muted);text-decoration:none;font-size:10px;font-weight:600;padding:8px 16px;margin-bottom:36px;letter-spacing:2px;text-transform:uppercase;border-radius:6px;transition:all 0.2s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.article-body{font-size:18px;line-height:1.9;color:#2D2420;font-weight:300}
.article-body p{margin-bottom:26px}
.article-body h2{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--ink);margin:52px 0 16px;letter-spacing:-0.5px;position:relative;padding-bottom:12px}
.article-body h2::after{content:'';position:absolute;bottom:0;left:0;width:30px;height:2px;background:var(--accent)}
.article-body h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ink);margin:28px 0 10px}
.article-body a{color:var(--accent);font-weight:500;text-decoration:none;border-bottom:1px solid rgba(124,58,237,0.3);transition:all 0.2s}
.article-body a:hover{color:var(--ink);border-color:var(--ink)}
.article-body ul,.article-body ol{padding-left:26px;margin-bottom:22px}
.article-body li{margin-bottom:8px;line-height:1.8}
.article-body strong{font-weight:600;color:var(--ink)}
blockquote{border-left:3px solid var(--accent);padding:0 0 0 24px;margin:34px 0;font-family:'Playfair Display',serif;font-size:22px;font-style:italic;color:var(--ink);line-height:1.55}
.sidebar{display:flex;flex-direction:column;gap:14px}
.widget{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.wh{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--warm);display:flex;align-items:center;gap:8px}
.wh-gem{width:7px;height:7px;background:var(--accent);transform:rotate(45deg);flex-shrink:0}
.wh-title{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink)}
.wb{padding:14px 18px}
.ri{padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:padding 0.15s}
.ri:last-child{border-bottom:none;padding-bottom:0}.ri:first-child{padding-top:0}
.ri:hover{padding-left:5px}
.ri-cat{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.ri-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--ink);line-height:1.25;text-decoration:none;display:block;font-weight:500}
.ri-title:hover{color:var(--accent)}
.ri-meta{font-size:11px;color:var(--light);margin-top:2px}
.brand-box{background:linear-gradient(135deg,var(--mid),#3D1F54);padding:22px;border-radius:10px;text-align:center}
.bb-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.bb-name .g{color:var(--violet)}
.bb-text{font-size:12px;color:rgba(255,255,255,0.4);line-height:1.65;font-weight:300}
.not-found{text-align:center;padding:80px;color:var(--muted);grid-column:1/-1}
footer{background:var(--mid);margin-top:52px;text-align:center;padding:24px;font-size:12px;color:rgba(255,255,255,0.2)}
footer a{color:rgba(255,255,255,0.2);text-decoration:none;margin:0 10px;transition:color 0.2s}
footer a:hover{color:#fff}
.fl{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.fl span{color:var(--violet)}
</style>
</head>
<body>
<header><div class="hdr-inner"><a href="index.html" class="logo"><div class="logo-name">Zeit<span class="g">Geist</span></div></a></div></header>
<nav><div class="nav-inner"><a href="index.html">← Start</a><a href="index.html">Politik</a><a href="index.html">Wirtschaft</a><a href="index.html">Gesellschaft</a><a href="index.html">Kultur</a><a href="index.html">Technik</a></div></nav>
<div id="post-hero" class="post-hero" style="display:none">
  <div class="ph-inner">
    <div>
      <div class="ph-breadcrumb"><a href="index.html">Start</a><span>/</span><span id="ph-cat-bc">Allgemein</span></div>
      <div class="ph-tag" id="ph-cat">Allgemein</div>
      <div class="ph-title" id="ph-title"></div>
      <div class="ph-meta"><div class="ph-av" id="ph-av">R</div><strong id="ph-author">Redaktion</strong><span>· <span id="ph-date"></span></span><span>· <span id="ph-read">5 Min.</span></span></div>
    </div>
    <div class="ph-visual"><div class="ph-vis-gem"></div><div class="ph-vis-letter" id="ph-letter">A</div></div>
  </div>
</div>
<div class="layout">
  <div class="main-col">
    <a href="index.html" class="back-btn">← Alle Artikel</a>
    <div id="article-body" class="article-body"></div>
    <div id="not-found" class="not-found" style="display:none"><h2 style="font-family:'Playfair Display',serif;font-size:34px;color:var(--ink)">Artikel nicht gefunden.</h2></div>
  </div>
  <aside class="sidebar">
    <div class="brand-box"><div class="bb-name">Zeit<span class="g">Geist</span></div><div class="bb-text">Gedanken für unsere Zeit — täglich neu.</div></div>
    <div class="widget"><div class="wh"><div class="wh-gem"></div><div class="wh-title">Weitere Artikel</div></div><div class="wb"><div id="recent-posts"></div></div></div>
  </aside>
</div>
<footer><div class="fl">Zeit<span>Geist</span></div><p>&copy; 2026 ZeitGeist &nbsp;|&nbsp;<a href="#">Impressum</a>&nbsp;|&nbsp;<a href="#">Datenschutz</a></p></footer>
<script>
// Constants
const GIST_ID = '42ea11087f40fdba423f8eb0f575ac96';
const SITE_NAME = 'zeitgeist';
const RAW_URL = `https://gist.githubusercontent.com/Hamzamain-spec/${GIST_ID}/raw/posts.json`;

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

async function loadPost() {
  try {
    const response = await fetch(RAW_URL);
    const allPosts = await response.json();
    
    // Filter posts by site name
    const sitePosts = Array.isArray(allPosts) 
      ? allPosts.filter(p => p.site === SITE_NAME)
      : [];
    
    const post = sitePosts.find(p => p.id == id);
    
    if (post) {
      document.title = post.title + ' — ZeitGeist';
      document.getElementById('ph-title').textContent = post.title;
      document.getElementById('ph-cat').textContent = post.category || 'Allgemein';
      document.getElementById('ph-cat-bc').textContent = post.category || 'Allgemein';
      document.getElementById('ph-author').textContent = post.author || 'Redaktion';
      document.getElementById('ph-av').textContent = (post.author || 'R').charAt(0).toUpperCase();
      document.getElementById('ph-date').textContent = new Date(post.date).toLocaleDateString('de-DE', {day:'numeric', month:'long', year:'numeric'});
      
      const w = post.content.replace(/<[^>]+>/g, '').split(' ').length;
      document.getElementById('ph-read').textContent = Math.max(1, Math.round(w / 200)) + ' Min. Lesezeit';
      document.getElementById('ph-letter').textContent = post.title.charAt(0).toUpperCase();
      document.getElementById('article-body').innerHTML = post.content;
      document.getElementById('post-hero').style.display = 'block';
      
      // Recent posts (excluding current)
      const rp = document.getElementById('recent-posts');
      rp.innerHTML = '';
      sitePosts.slice().reverse().slice(0, 6).forEach(p => {
        if (p.id == id) return;
        rp.innerHTML += `<div class="ri">
          <div class="ri-cat">${p.category || 'Allgemein'}</div>
          <a class="ri-title" href="post.html?id=${p.id}">${p.title}</a>
          <div class="ri-meta">${p.author || 'Redaktion'} · ${new Date(p.date).toLocaleDateString('de-DE')}</div>
        </div>`;
      });
    } else {
      document.getElementById('not-found').style.display = 'block';
    }
  } catch (e) {
    console.error('Error loading post:', e);
    document.getElementById('not-found').style.display = 'block';
  }
}

// Load the post
loadPost();
</script>
</body>
</html>
